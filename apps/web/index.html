<!doctype html>
<html lang="zh-CN" data-theme="warm">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>拾光同学录</title>
    <script>
      (function () {
        try {
          var allowed = ['warm', 'noir', 'marine', 'forest'];
          var saved = localStorage.getItem('classbook:theme');
          if (saved && allowed.indexOf(saved) !== -1) {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (error) {}
      })();
    </script>
    <meta name="description" content="属于我们班级的同学录：档案、留言、相册与回忆。" />
    <link
      rel="preload"
      as="image"
      href="/uploads/f08b4e23-e5d7-4501-bad6-b429b8916fb6-1280.avif"
      imagesrcset="/uploads/f08b4e23-e5d7-4501-bad6-b429b8916fb6-1024.avif 1024w, /uploads/f08b4e23-e5d7-4501-bad6-b429b8916fb6-1280.avif 1280w"
      imagesizes="(min-width: 768px) 1120px, 100vw"
      type="image/avif"
      fetchpriority="high"
    />
    <style>
      html,
      body {
        margin: 0;
        background: #f7f2e9;
      }
      .boot-splash {
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: #6b5a48;
        font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
        text-align: center;
      }
      .boot-splash strong {
        display: block;
        font-size: 22px;
        letter-spacing: 0.18em;
        font-weight: 600;
      }
      .boot-splash span {
        display: block;
        margin-top: 10px;
        font-size: 12px;
        letter-spacing: 0.12em;
        opacity: 0.65;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" aria-hidden="true">
        <div>
          <strong>拾光同学录</strong>
          <span>正在打开我们的回忆…</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
