name: Publish packages

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  public:
    runs-on: ubuntu-latest
    steps:
      - name: Make GHCR packages public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for pkg in classbook-api classbook-web; do
            echo "Making ${pkg} public"
            gh api --method PATCH \
              "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${pkg}" \
              -f visibility=public
          done
